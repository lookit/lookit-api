<table class="table table-sm align-middle mb-0 w-100" style="table-layout: fixed;">
    <colgroup>
        <col style="width: 52%;">
        <col style="width: 12%;">
        <col style="width: 12%;">
        <col style="width: 12%;">
        <col style="width: 12%;">
    </colgroup>
    {% if show_headers %}
    <thead>
        <tr>
            <th scope="col" class="text-center py-3 text-nowrap"></th>
            <th scope="col" class="text-center py-3 text-nowrap">
                Tallied
                <svg class="icon-tallied-check d-inline"xmlns="http://www.w3.org/2000/svg" height="24" width="24" viewBox="0 0 640 640"><!--!Font Awesome Free v7.2.0 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2026 Fonticons, Inc.--><path d="M530.8 134.1C545.1 144.5 548.3 164.5 537.9 178.8L281.9 530.8C276.4 538.4 267.9 543.1 258.5 543.9C249.1 544.7 240 541.2 233.4 534.6L105.4 406.6C92.9 394.1 92.9 373.8 105.4 361.3C117.9 348.8 138.2 348.8 150.7 361.3L252.2 462.8L486.2 141.1C496.6 126.8 516.6 123.6 530.9 134z"/></svg>
            </th>
            <th scope="col" class="text-center py-3 text-nowrap">
                Untallied
                <svg class="icon-tallied-xmark d-inline" xmlns="http://www.w3.org/2000/svg" height="24" width="24" viewBox="0 0 640 640"><!--!Font Awesome Free v7.2.0 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2026 Fonticons, Inc.--><path d="M504.6 148.5C515.9 134.9 514.1 114.7 500.5 103.4C486.9 92.1 466.7 93.9 455.4 107.5L320 270L184.6 107.5C173.3 93.9 153.1 92.1 139.5 103.4C125.9 114.7 124.1 134.9 135.4 148.5L278.3 320L135.4 491.5C124.1 505.1 125.9 525.3 139.5 536.6C153.1 547.9 173.3 546.1 184.6 532.5L320 370L455.4 532.5C466.7 546.1 486.9 547.9 500.5 536.6C514.1 525.3 515.9 505.1 504.6 491.5L361.7 320L504.6 148.5z"/></svg>
            </th>
            <th scope="col" class="text-center py-3 text-nowrap">Preview <strong>P</strong></th>
            <th scope="col" class="text-center py-3 text-nowrap">Total</th>
        </tr>
    </thead>
    {% endif %}
    <tbody>
        <tr>
            <td>
                <div style="min-height: 7rem;">
                    <p class="fw-bold mb-1">{{ group_title }}</p>
                    <p class="text-muted mb-0">{{ group_description }}</p>
                </div>
            </td>
            <td class="text-center fs-3 {% if highlight_success %}bg-success bg-opacity-25{% endif %}">{% if group_tallied == "NA" %}-{% else %}{{ group_tallied }}{% endif %}</td>
            <td class="text-center fs-3">{{ group_untallied }}</td>
            <td class="text-center fs-3">{{ group_preview }}</td>
            <td class="text-center fs-3 border-start">{{ group_total }}</td>
        </tr>
    </tbody>
</table>
